<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101412" />
    <meta
      name="description"
      content="الانجاز — منصة تعليمية للمقررات والمحاضرات وبنك الأسئلة التفاعلي."
    />
    <title>منصة الانجاز التعليمية | IT Learning Hub</title>
    <style>
      :root {
        color-scheme: dark;
        background: #101412;
        font-family: system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 320px;
        height: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .owner-bar {
        display: flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 0.65rem 1rem;
        border-bottom: 1px solid #26332c;
        background: #101412;
        color: #f3f4f6;
        font-size: 0.9rem;
      }

      .owner-bar a {
        color: #34d399;
        text-decoration: none;
      }

      .owner-bar a:hover {
        text-decoration: underline;
      }

      .site {
        display: block;
        width: 100%;
        min-height: 0;
        flex: 1;
        border: 0;
        background: #101412;
      }

      .fallback {
        display: grid;
        min-height: 50vh;
        place-content: center;
        gap: 1rem;
        padding: 2rem;
        color: #f3f4f6;
        text-align: center;
      }

      .fallback a {
        color: #34d399;
      }

      @media (max-width: 480px) {
        .owner-bar {
          gap: 0.6rem;
          font-size: 0.78rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="owner-bar" aria-label="بيانات التواصل">
      <strong>Fatma Sabry Abdallah</strong>
      <a href="tel:01285949284" dir="ltr">01285949284</a>
    </header>
    <iframe
      class="site"
      src="https://zatoona-platform.vercel.app/"
      title="منصة الانجاز التعليمية — IT Learning Hub"
      allowfullscreen
    >
      <div class="fallback">
        <p>تعذر عرض المنصة في هذه الصفحة.</p>
        <a href="https://zatoona-platform.vercel.app/">افتح المنصة مباشرةً</a>
      </div>
    </iframe>
  </body>
</html>
